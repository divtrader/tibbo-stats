name: Update Tibbo analytics
on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: analytics
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch YouTube Analytics
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python scripts/update_analytics.py
      - name: Save
        run: |
          if [ -n "$(git status --porcelain analytics.json)" ]; then
            git config user.name "tibbo-stats-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add analytics.json
            git commit -m "Update analytics"
            git push
          fi
